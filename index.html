<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockLock Medical – Prototipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="src/tailwind.config.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; line-height: 1; }
    .icon-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes pulso-conflicto { 0%,100% { box-shadow: 0 0 0 0 rgba(186,26,26,.35); } 50% { box-shadow: 0 0 0 6px rgba(186,26,26,0); } }
    .pulso-conflicto { animation: pulso-conflicto 1.2s ease-in-out 2; }
  </style>
</head>
<body class="h-full bg-background text-on-surface font-body-md text-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
  <div id="app" class="h-full"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>
  <noscript>Este prototipo necesita JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
